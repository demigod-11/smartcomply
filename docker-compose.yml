services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_data &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  worker:
    build:
      context: .
      target: runtime
    env_file:
      - .env
    command: python manage.py qcluster
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  test:
    profiles:
      - test
    build:
      context: .
      target: test
    environment:
      DJANGO_ENV: test
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests

volumes:
  postgres_data:
